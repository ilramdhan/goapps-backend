# Backend CI Gate — the single required status check for PRs into main.
#
# The per-service workflows (finance, iam, ppc, cost worker/orchestrator) use
# path filters, so most PRs only trigger some of them and a docs-only PR
# triggers none. Requiring their checks directly would leave such PRs blocked
# forever on checks that never start. This gate always runs: it waits for
# every other check run on the PR head commit and fails if any of them failed.
name: Backend CI Gate

on:
  pull_request:
    branches: [main, develop]

permissions:
  checks: read
  contents: read

concurrency:
  group: ci-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for service checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Give path-filtered workflows time to register their check runs.
          sleep 30
          while true; do
            runs=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.app.slug == "github-actions" and .name != "CI Gate") | "\(.status)|\(.conclusion)|\(.name)"')
            pending=$(echo "$runs" | grep -v '^completed|' | grep -c . || true)
            failed=$(echo "$runs" | grep -E '^completed\|(failure|cancelled|timed_out|action_required)\|' || true)
            if [ -n "$failed" ]; then
              echo "::error::Service checks failed:"
              echo "$failed" | cut -d'|' -f3- | sed 's/^/  - /'
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "All service checks passed (or none were triggered for this PR):"
              echo "$runs" | grep . | awk -F'|' '{print "  - " $3 ": " $2}' || true
              exit 0
            fi
            echo "Waiting for $pending check(s)..."
            sleep 20
          done
