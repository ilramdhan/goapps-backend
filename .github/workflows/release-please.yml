name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      finance--tag_name: ${{ steps.release.outputs['services/finance--tag_name'] }}
      iam--tag_name: ${{ steps.release.outputs['services/iam--tag_name'] }}
      hr--tag_name: ${{ steps.release.outputs['services/hr--tag_name'] }}
      ppc--tag_name: ${{ steps.release.outputs['services/ppc--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build and push Docker images for released services
  build-finance:
    needs: release-please
    if: ${{ needs.release-please.outputs.finance--tag_name }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Extract version
        id: version
        run: |
          # Extract clean version from tag (e.g., "finance-service/v1.0.0" -> "v1.0.0")
          TAG="${{ needs.release-please.outputs.finance--tag_name }}"
          VERSION=$(echo "$TAG" | sed 's|.*/||')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Clean version: $VERSION"
      
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push finance-service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./services/finance/Dockerfile
          push: true
          tags: |
            ghcr.io/mutugading/finance-service:${{ steps.version.outputs.version }}
            ghcr.io/mutugading/finance-service:latest

  build-iam:
    needs: release-please
    if: ${{ needs.release-please.outputs.iam--tag_name }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Extract version
        id: version
        run: |
          # Extract clean version from tag (e.g., "iam-service/v0.2.0" -> "v0.2.0")
          TAG="${{ needs.release-please.outputs.iam--tag_name }}"
          VERSION=$(echo "$TAG" | sed 's|.*/||')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Clean version: $VERSION"
      
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push iam-service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./services/iam/Dockerfile
          push: true
          tags: |
            ghcr.io/mutugading/iam-service:${{ steps.version.outputs.version }}
            ghcr.io/mutugading/iam-service:latest

  build-hr:
    needs: release-please
    if: ${{ needs.release-please.outputs.hr--tag_name }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Extract version
        id: version
        run: |
          # Extract clean version from tag (e.g., "hr-service/v1.0.0" -> "v1.0.0")
          TAG="${{ needs.release-please.outputs.hr--tag_name }}"
          VERSION=$(echo "$TAG" | sed 's|.*/||')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Clean version: $VERSION"
      
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push hr-service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./services/hr/Dockerfile
          push: true
          tags: |
            ghcr.io/mutugading/hr-service:${{ steps.version.outputs.version }}
            ghcr.io/mutugading/hr-service:latest

  build-ppc:
    needs: release-please
    if: ${{ needs.release-please.outputs.ppc--tag_name }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: |
          # Extract clean version from tag (e.g., "ppc-service/v0.1.0" -> "v0.1.0")
          TAG="${{ needs.release-please.outputs.ppc--tag_name }}"
          VERSION=$(echo "$TAG" | sed 's|.*/||')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Clean version: $VERSION"

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ppc-service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./services/ppc/Dockerfile
          push: true
          tags: |
            ghcr.io/mutugading/ppc-service:${{ steps.version.outputs.version }}
            ghcr.io/mutugading/ppc-service:latest
