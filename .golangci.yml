# golangci-lint v2.3.0 configuration
# https://golangci-lint.run/

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mutugading/goapps-backend

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - dupl
    - errname
    - errorlint
    - exhaustive
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - prealloc
    - predeclared
    - revive
    - unconvert
    - unparam
    - whitespace
    - forbidigo
  settings:
    # forbidigo is path-scoped (see exclusions below): ERP integration money
    # math must use shopspring/decimal, never binary floats (design §6.1-6.3).
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^float(32|64)$
          msg: "use github.com/shopspring/decimal in ERP integration code (no float32/float64)"
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    dupl:
      threshold: 300
    goconst:
      min-len: 3
      min-occurrences: 3
    gosec:
      excludes:
        - G104
    misspell:
      locale: US
      ignore-rules:
        - colourant
        - colour
        # "cancelled" is the deliberate British-spelled persisted value used by
        # the cost job status (CANCELLED) and closed_substatus ('cancelled') —
        # baked into DB CHECK constraints + proto enums, not a typo to fix.
        - cancelled
    nestif:
      min-complexity: 4
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    paths:
      - gen/
      - ".*_test\\.go$"
    rules:
      # forbidigo applies ONLY to the ERP integration domain packages
      # (erpintegration, erprule) and the application-layer derive* files;
      # everywhere else it is excluded.
      - path-except: (internal/domain/erpintegration/|internal/domain/erprule/|internal/application/erpintegration/derive[^/]*\.go$)
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - dupl
          - gosec
          - goconst
          - gocognit

output:
  formats:
    text:
      path: stdout
