; Local mirror of the VPS PgBouncer (pgbouncer-vps): transaction pooling +
; max_prepared_statements=200 (R-16: pgx statement cache works through it).
; Only the *_app roles are in userlist.txt — owners (migrate/seed) go direct to Postgres.
[databases]
iam_db     = host=postgres-v2 port=5432 dbname=iam_db
finance_db = host=postgres-v2 port=5432 dbname=finance_db
ppc_db     = host=postgres-v2 port=5432 dbname=ppc_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_prepared_statements = 200
max_client_conn = 500
default_pool_size = 20
server_tls_sslmode = disable
ignore_startup_parameters = extra_float_digits
server_reset_query = DISCARD ALL
admin_users = postgres
